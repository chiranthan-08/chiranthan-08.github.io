<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="cyanGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="purpleGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad1)" rx="16" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="120" r="130" fill="#00f2fe" opacity="0.15" filter="url(#glow1)" />
  <circle cx="620" cy="300" r="140" fill="#8b5cf6" opacity="0.18" filter="url(#glow1)" />

  <!-- Mockup UI Window -->
  <rect x="70" y="50" width="660" height="350" rx="14" fill="#131b2e" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1.5" />
  
  <!-- Window Header -->
  <rect x="70" y="50" width="660" height="42" rx="14" fill="#1e293b" />
  <circle cx="98" cy="71" r="5" fill="#ef4444" />
  <circle cx="116" cy="71" r="5" fill="#f59e0b" />
  <circle cx="134" cy="71" r="5" fill="#10b981" />
  
  <!-- Search Bar Inside Header -->
  <rect x="180" y="60" width="340" height="22" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.1)" />
  <text x="210" y="75" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">🔍 search engineering colleges, cutoffs, Karnataka rank...</text>
  
  <!-- Left Filter Panel -->
  <rect x="95" y="110" width="170" height="265" rx="10" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255,255,255,0.06)" />
  <text x="110" y="135" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">SEARCH FILTERS</text>
  
  <!-- Filter Pills -->
  <rect x="110" y="150" width="140" height="24" rx="6" fill="#1e293b" />
  <text x="120" y="166" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="10">Branch: ISE / CSE / AI</text>
  
  <rect x="110" y="182" width="140" height="24" rx="6" fill="#1e293b" />
  <text x="120" y="198" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="10">Location: Karnataka</text>
  
  <rect x="110" y="214" width="140" height="24" rx="6" fill="#1e293b" />
  <text x="120" y="230" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="10">Cutoff Range: 1k - 40k</text>

  <rect x="110" y="250" width="140" height="28" rx="8" fill="url(#cyanGrad1)" />
  <text x="135" y="268" fill="#090d16" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">Apply Filter</text>

  <!-- Right College Cards Grid -->
  <!-- Card 1 -->
  <rect x="285" y="110" width="420" height="75" rx="10" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(0, 242, 254, 0.25)" />
  <rect x="300" y="125" width="44" height="44" rx="8" fill="#0284c7" />
  <text x="313" y="152" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold">🎓</text>
  <text x="355" y="137" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold">Channabasaveshwara Institute of Tech</text>
  <text x="355" y="155" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10.5">Tumkur, Karnataka • Ranking #15 • Cutoff: 12,450</text>
  <rect x="355" y="162" width="70" height="15" rx="4" fill="#065f46" />
  <text x="362" y="173" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="bold">ADMISSIONS OPEN</text>

  <!-- Card 2 -->
  <rect x="285" y="195" width="420" height="75" rx="10" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(139, 92, 246, 0.25)" />
  <rect x="300" y="210" width="44" height="44" rx="8" fill="#7c3aed" />
  <text x="313" y="237" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold">🏛️</text>
  <text x="355" y="222" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold">Top Engineering Hubs Karnataka</text>
  <text x="355" y="240" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10.5">Bengaluru, Mysuru, Hubballi • Verified Datasets</text>
  <rect x="355" y="247" width="80" height="15" rx="4" fill="#1e1b4b" />
  <text x="362" y="258" fill="#a78bfa" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="bold">CUTOFF UPDATED</text>

  <!-- Card 3 Mini Stats -->
  <rect x="285" y="280" width="200" height="95" rx="10" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255,255,255,0.06)" />
  <text x="300" y="305" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="bold">200+</text>
  <text x="300" y="325" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Institutes Listed</text>
  <text x="300" y="348" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="10">⚡ 100% Real-time updates</text>

  <rect x="500" y="280" width="205" height="95" rx="10" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255,255,255,0.06)" />
  <text x="515" y="305" fill="#a855f7" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="bold">Multi-Device</text>
  <text x="515" y="325" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Mobile, Tablet, Desktop</text>
  <text x="515" y="348" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="10">📱 Fully Responsive UI</text>
</svg>
