<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#141c30" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad2)" rx="16" />

  <!-- Subtle Cyber Tech Grid -->
  <g stroke="rgba(16, 185, 129, 0.05)" stroke-width="1">
    <circle cx="400" cy="225" r="80" fill="none" />
    <circle cx="400" cy="225" r="160" fill="none" stroke-dasharray="4 6" />
    <circle cx="400" cy="225" r="240" fill="none" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="400" y1="0" x2="400" y2="450" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="650" cy="120" r="120" fill="#10b981" opacity="0.16" filter="url(#glow2)" />
  <circle cx="160" cy="320" r="130" fill="#6366f1" opacity="0.18" filter="url(#glow2)" />

  <!-- Main AI Dashboard Window -->
  <rect x="70" y="45" width="660" height="360" rx="14" fill="#0f172a" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5" />

  <!-- Top bar -->
  <rect x="70" y="45" width="660" height="42" rx="14" fill="#1e293b" />
  <circle cx="98" cy="66" r="5" fill="#ef4444" />
  <circle cx="116" cy="66" r="5" fill="#f59e0b" />
  <circle cx="134" cy="66" r="5" fill="#10b981" />
  <text x="160" y="70" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">AI Event Master Hub • MERN Stack + AI Agents</text>
  <rect x="580" y="55" width="130" height="22" rx="6" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" />
  <text x="592" y="70" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold">● LIVE ATTENDANCE</text>

  <!-- Left Stats & AI Assistant -->
  <rect x="95" y="105" width="200" height="135" rx="10" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255,255,255,0.06)" />
  <text x="110" y="130" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">🤖 AI EVENT PLANNER</text>
  <rect x="110" y="142" width="170" height="45" rx="6" fill="#0f172a" />
  <text x="118" y="158" fill="#a78bfa" font-family="'Segoe UI', sans-serif" font-size="9.5">"AI generated optimal schedule,</text>
  <text x="118" y="174" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="9.5">booth layouts & speaker flow."</text>
  <rect x="110" y="198" width="80" height="22" rx="5" fill="url(#neonEmerald)" />
  <text x="120" y="213" fill="#042f2e" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold">Auto Plan ⚡</text>

  <!-- Role-Based Badge Matrix (Users, Organisers, Admins) -->
  <rect x="95" y="255" width="200" height="130" rx="10" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255,255,255,0.06)" />
  <text x="110" y="278" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="bold">🔐 3 ROLE ACCESS CONTROL</text>
  
  <rect x="110" y="290" width="170" height="24" rx="5" fill="#1e1b4b" />
  <text x="120" y="306" fill="#c084fc" font-family="'Segoe UI', sans-serif" font-size="10">👑 Administrators: Full Gov</text>
  
  <rect x="110" y="320" width="170" height="24" rx="5" fill="#064e3b" />
  <text x="120" y="336" fill="#6ee7b7" font-family="'Segoe UI', sans-serif" font-size="10">🎯 Organisers: Analytics & Check-in</text>

  <rect x="110" y="350" width="170" height="24" rx="5" fill="#1e293b" />
  <text x="120" y="366" fill="#93c5fd" font-family="'Segoe UI', sans-serif" font-size="10">👥 Users: Geolocation Discovery</text>

  <!-- Right Event Stream & Live Attendance Grid -->
  <rect x="315" y="105" width="395" height="155" rx="10" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255,255,255,0.06)" />
  <text x="330" y="130" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold">📍 Geolocation Discovery & Live Venue Map</text>
  
  <!-- Mini Map Box -->
  <rect x="330" y="145" width="170" height="100" rx="8" fill="#090d16" stroke="rgba(56, 189, 248, 0.3)" />
  <!-- Map routes -->
  <path d="M 345 220 Q 380 180 420 200 T 480 160" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="3 3" />
  <circle cx="345" cy="220" r="5" fill="#38bdf8" />
  <circle cx="480" cy="160" r="6" fill="#ef4444" />
  <text x="345" y="165" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="9">Bengaluru Tech Hub</text>
  <rect x="420" y="175" width="70" height="16" rx="4" fill="#ef4444" />
  <text x="426" y="186" fill="#fff" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="bold">VENUE PIN</text>

  <!-- Live Counter Cards -->
  <rect x="515" y="145" width="180" height="45" rx="8" fill="#131e33" stroke="rgba(16, 185, 129, 0.3)" />
  <text x="530" y="165" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold">1,480+</text>
  <text x="530" y="180" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">Active Attendees Checked-In</text>

  <rect x="515" y="200" width="180" height="45" rx="8" fill="#131e33" stroke="rgba(139, 92, 246, 0.3)" />
  <text x="530" y="220" fill="#c084fc" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold">99.8%</text>
  <text x="530" y="235" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">AI Attendance Accuracy</text>

  <!-- Bottom Tech Stack Banner -->
  <rect x="315" y="275" width="395" height="110" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.2)" />
  <text x="330" y="300" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="bold">TECH ARCHITECTURE</text>
  
  <g transform="translate(330, 312)">
    <rect x="0" y="0" width="80" height="28" rx="6" fill="#1e293b" />
    <text x="14" y="18" fill="#61dafb" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">⚛ React.js</text>

    <rect x="90" y="0" width="80" height="28" rx="6" fill="#1e293b" />
    <text x="105" y="18" fill="#68a063" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">🟢 Node.js</text>

    <rect x="180" y="0" width="90" height="28" rx="6" fill="#1e293b" />
    <text x="193" y="18" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">⚡ Express.js</text>

    <rect x="280" y="0" width="95" height="28" rx="6" fill="#1e293b" />
    <text x="290" y="18" fill="#4db33d" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold">🍃 MongoDB</text>
  </g>
  <text x="330" y="365" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">Real-time WebSockets • Role-Based JWT • Geolocation Services</text>
</svg>
