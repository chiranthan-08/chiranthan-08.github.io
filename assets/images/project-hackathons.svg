      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad4)" rx="16" />

  <circle cx="200" cy="130" r="140" fill="#f59e0b" opacity="0.15" filter="url(#glow4)" />
  <circle cx="620" cy="310" r="140" fill="#a855f7" opacity="0.18" filter="url(#glow4)" />

